version: 2

models:
  - name: stg_deal_changes
    description: "Staging model for deal changes, filtered only for critical funnel fields: stage_id, user_id, add_time, and lost_reason."
    columns:
      - name: deal_id
        description: "The ID of the related Deal."
        tests:
          - not_null
      
      - name: changed_at
        description: "The timestamp when the change event occurred."
        tests:
          - not_null
      
      - name: changed_field
        description: "The key of the field that was changed."
        tests:
          - accepted_values:
              values: ['stage_id', 'user_id', 'add_time', 'lost_reason']
      
      - name: new_stage_id
        description: "The new stage ID, only populated if 'changed_field' was 'stage_id'."
      
      - name: new_user_id
        description: "The new user ID, only populated if 'changed_field' was 'user_id'."
      
      - name: new_add_time
        description: "The deal's add time, only populated if 'changed_field' was 'add_time'."
      
      - name: new_lost_reason_value
        description: "The new lost reason value, only populated if 'changed_field' was 'lost_reason'."
          
    # Composite uniqueness test for ensuring accurate sequencing of events in the SCD model.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - deal_id
            - changed_at
            - changed_field